<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelaScript (හෙළස්ක්‍රිප්ට්) - Interactive Web Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+Sinhala:wght@400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #121826;
      --bg-card: rgba(22, 30, 49, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.3);
      --cyan: #06b6d4;
      --green: #10b981;
      --red: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-ui: 'Outfit', 'Noto Sans Sinhala', sans-serif;
      --font-code: 'JetBrains Mono', 'Noto Sans Sinhala', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header */
    header {
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand img {
      height: 38px;
      width: auto;
      filter: drop-shadow(0 0 10px var(--accent-glow));
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .brand-tag {
      font-size: 0.75rem;
      color: var(--cyan);
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.25);
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    select, button {
      font-family: var(--font-ui);
      font-size: 0.875rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    select {
      background: var(--bg-secondary);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.45rem 0.85rem;
    }

    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn-run {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 0.45rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .btn-run:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
    }

    .btn-clear {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 0.45rem 0.85rem;
    }

    .btn-clear:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Main Container */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1rem 1.5rem;
      height: calc(100vh - 65px);
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .card-header {
      padding: 0.65rem 1rem;
      background: rgba(18, 24, 38, 0.6);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0.5rem;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .tab-btn.active {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
      font-weight: 700;
    }

    /* Editor */
    #editor {
      flex: 1;
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      color: #e5e7eb;
      font-family: var(--font-code);
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 1rem;
      resize: none;
      outline: none;
      white-space: pre;
    }

    /* Console & Tabs Content */
    .tab-content {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      font-family: var(--font-code);
      font-size: 0.875rem;
      line-height: 1.6;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .console-log {
      color: #34d399;
      margin-bottom: 0.35rem;
      word-break: break-word;
    }

    .console-error {
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border-left: 3px solid var(--red);
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.5rem;
      border-radius: 0 6px 6px 0;
      white-space: pre-wrap;
    }

    .status-bar {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    pre.json-view {
      color: #93c5fd;
      font-family: var(--font-code);
      font-size: 0.8rem;
    }

    .token-pill {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      margin: 0.15rem;
      border-radius: 4px;
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
    }
    .token-kw { color: #f59e0b; border-color: rgba(245, 158, 11, 0.3); }
    .token-lit { color: #10b981; border-color: rgba(16, 185, 129, 0.3); }
    .token-id { color: #06b6d4; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="../assets/logo/hela-logo-full.png" alt="HelaScript Logo" onerror="this.style.display='none'">
      <span class="brand-title">HelaScript (හෙළස්ක්‍රිප්ට්)</span>
      <span class="brand-tag">Web Playground v1.1</span>
    </div>

    <div class="toolbar">
      <select id="exampleSelector" onchange="loadPresetExample()">
        <option value="hello">👋 01_hello.hela (ආයුබෝවන්)</option>
        <option value="variables">📦 02_variables.hela (විචල්‍ය)</option>
        <option value="functions">⚙️ 04_functions.hela (ක්‍රියා)</option>
        <option value="async">⚡ 05_async_flow.hela (අසමමුහුර්ත)</option>
        <option value="api">🌐 10_api_client.hela (REST API)</option>
        <option value="error">🛡️ 12_error_handling.hela (දෝෂ හැසිරවීම)</option>
      </select>

      <button class="btn-clear" onclick="clearConsole()">පිරිසිදු කරන්න</button>
      <button class="btn-run" onclick="runScript()">ධාවනය කරන්න ▶</button>
    </div>
  </header>

  <main>
    <!-- Left: Code Editor -->
    <div class="card">
      <div class="card-header">
        <span>📜 කේත සංස්කාරකය (Editor)</span>
        <span id="charCount">0 අකුරු</span>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="මෙහි HelaScript කේතය ලියන්න..."></textarea>
    </div>

    <!-- Right: Output & Explorer Tabs -->
    <div class="card">
      <div class="card-header">
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('console')">🖥️ කොන්සෝලය (Console)</button>
          <button class="tab-btn" onclick="switchTab('ast')">🌳 AST Explorer</button>
          <button class="tab-btn" onclick="switchTab('tokens')">🔤 Tokens</button>
        </div>
        <div class="status-bar">
          <span class="status-dot"></span>
          <span id="execTimer">සූදානම්</span>
        </div>
      </div>

      <!-- Tab 1: Console -->
      <div id="tab-console" class="tab-content active">
        <div id="consoleOutput">
          <div style="color: var(--text-muted); font-style: italic;">
            HelaScript කේතය ධාවනය කිරීමට ඉහළ ඇති 'ධාවනය කරන්න ▶' බොත්තම ඔබන්න.
          </div>
        </div>
      </div>

      <!-- Tab 2: AST -->
      <div id="tab-ast" class="tab-content">
        <pre id="astOutput" class="json-view">// කේතය ධාවනය කළ පසු Abstract Syntax Tree (AST) මෙහි දැක්වේ.</pre>
      </div>

      <!-- Tab 3: Tokens -->
      <div id="tab-tokens" class="tab-content">
        <div id="tokensOutput">// Lexical Tokens මෙහි දැක්වේ.</div>
      </div>
    </div>
  </main>

  <!-- Load bundled HelaScript Web Runtime -->
  <script src="../dist/helascript-web.js"></script>

  <script>
    const presets = {
      hello: `// HelaScript - හෙළස්ක්‍රිප්ට්
// 01_hello.hela: මූලික වැඩසටහන

ලියන්න("ආයුබෝවන් HelaScript! 🇱🇰");
ලියන්න("දේශීය සිංහල ක්‍රමලේඛන භාෂාව සාර්ථකව ධාවනය වේ.");
`,
      variables: `// 02_variables.hela: විචල්‍ය සහ දත්ත වර්ග
දාන්න නම = "පැතුම්";
වෙනස්නොවන උපන්_වර්ෂය = 2003;
දාන්න වයස = 21;

ලියන්න("නම:", නම);
ලියන්න("වයස:", වයස);
ලියන්න("උපන් වර්ෂය:", උපන්_වර්ෂය);

// ලැයිස්තු
දාන්න ගණන් = [10, 20, 30, 40];
ලියන්න("ගණන් ලැයිස්තුව:", ගණන්);
ලියන්න("දිග:", දිග(ගණන්));
`,
      functions: `// 04_functions.hela: ශ්‍රිත (Functions) & Recursion
වැඩේ එකතු_කරන්න(a, b) {
    යවන්න a + b;
}

වැඩේ ෆැක්ටෝරියල්(n) {
    ඉදින් (n <= 1) {
        යවන්න 1;
    } නැත්තම් {
        යවන්න n * ෆැක්ටෝරියල්(n - 1);
    }
}

ලියන්න("5 + 10 =", එකතු_කරන්න(5, 10));
ලියන්න("5! =", ෆැක්ටෝරියල්(5));
`,
      async: `// 05_async_flow.hela: අසමමුහුර්ත ප්‍රවාහය (Async/Await)
වැඩේ නොපෙනෙන දත්ත_ප්‍රමාදය() {
    ලියන්න("තත්පර 1ක් ප්‍රමාද කරමින්...");
    ඉන්න නිදන්න(1000);
    යවන්න "ප්‍රමාදය අවසන් විය! ✅";
}

දාන්න ප්‍රතිඵලය = ඉන්න දත්ත_ප්‍රමාදය();
ලියන්න(ප්‍රතිඵලය);
`,
      api: `// 10_api_client.hela: REST API Client
දාන්න ප්‍රතිඵලය = api.ලබාගන්න("https://jsonplaceholder.typicode.com/todos/1");

ලියන්න("✅ API දත්ත ලැබුණි:");
ලියන්න("- මාතෘකාව:", ප්‍රතිඵලය.title);
ලියන්න("- අවසන් කර ඇත්ද?:", ප්‍රතිඵලය.completed);
`,
      error: `// 12_error_handling.hela: ස්වදේශීය දෝෂ හැසිරවීම (Try-Catch)
උත්සාහ කරන්න {
    ලියන්න("1. අනතුරුදායක ගණනය කිරීමක් උත්සාහ කරමින්...");
    දාන්න x = 100 / 0;
} අල්ලාගන්න (දෝෂය) {
    ලියන්න("⚠️ හසු වූ දෝෂය:", දෝෂය);
}

ලියන්න("2. වැඩසටහන සුරක්ෂිතව ඉදිරියට ගමන් කරයි! ✅");
`
    };

    const editor = document.getElementById('editor');
    const consoleOutput = document.getElementById('consoleOutput');
    const astOutput = document.getElementById('astOutput');
    const tokensOutput = document.getElementById('tokensOutput');
    const execTimer = document.getElementById('execTimer');
    const charCount = document.getElementById('charCount');

    editor.addEventListener('input', () => {
      charCount.textContent = `${editor.value.length} අකුරු`;
    });

    function loadPresetExample() {
      const selected = document.getElementById('exampleSelector').value;
      if (presets[selected]) {
        editor.value = presets[selected];
        charCount.textContent = `${editor.value.length} අකුරු`;
        clearConsole();
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tab === 'console') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('tab-console').classList.add('active');
      } else if (tab === 'ast') {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('tab-ast').classList.add('active');
      } else if (tab === 'tokens') {
        document.querySelector('.tab-btn:nth-child(3)').classList.add('active');
        document.getElementById('tab-tokens').classList.add('active');
      }
    }

    function clearConsole() {
      consoleOutput.innerHTML = '<div style="color: var(--text-muted); font-style: italic;">කොන්සෝලය පිරිසිදු කරන ලදී.</div>';
      execTimer.textContent = 'සූදානම්';
    }

    async function runScript() {
      const code = editor.value;
      if (!code.trim()) return;

      consoleOutput.innerHTML = '';
      execTimer.textContent = 'ධාවනය වේ...';

      // 1. Token visualizer
      try {
        const tokens = HelaScriptWeb.tokenizeWeb(code);
        tokensOutput.innerHTML = tokens.map(t => {
          let cls = 'token-id';
          if (['DAANNA', 'VENAS_NOVANA', 'WADE', 'YAVANNA', 'IDIN', 'NATTAM', 'UTSAHA', 'ALLANNA'].includes(t.type)) cls = 'token-kw';
          if (['NUMBER', 'STRING', 'ATTA', 'BORU', 'HIS'].includes(t.type)) cls = 'token-lit';
          return `<span class="token-pill ${cls}" title="${t.type} (L${t.line}:C${t.column})">${t.value}</span>`;
        }).join('');
      } catch (e) {
        tokensOutput.textContent = e.message;
      }

      // 2. AST visualizer
      try {
        const ast = HelaScriptWeb.parseWeb(code);
        astOutput.textContent = JSON.stringify(ast, null, 2);
      } catch (e) {
        astOutput.textContent = e.message;
      }

      // 3. Execution
      const res = await HelaScriptWeb.runWeb(code);
      execTimer.textContent = `${res.executionTimeMs} ms`;

      if (res.output && res.output.length > 0) {
        res.output.forEach(line => {
          const div = document.createElement('div');
          div.className = 'console-log';
          div.textContent = line;
          consoleOutput.appendChild(div);
        });
      }

      if (res.result !== undefined && res.result !== null) {
        const div = document.createElement('div');
        div.style.color = '#60a5fa';
        div.style.fontStyle = 'italic';
        div.textContent = `➡ ප්‍රතිඵලය: ${JSON.stringify(res.result)}`;
        consoleOutput.appendChild(div);
      }

      if (!res.success && res.error) {
        const div = document.createElement('div');
        div.className = 'console-error';
        div.textContent = res.error;
        consoleOutput.appendChild(div);
      }
    }

    // Initialize with hello world
    loadPresetExample();
  </script>
</body>
</html>
